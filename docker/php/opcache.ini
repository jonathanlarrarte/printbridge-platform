opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; validate_timestamps=0 congela el codigo en memoria hasta el proximo reinicio
; del contenedor -- correcto para un deploy inmutable (imagen nueva = contenedor
; nuevo), pero significa que un `docker compose restart app` es obligatorio
; despues de reconstruir la imagen, nunca alcanza con pisar archivos en vivo.
opcache.validate_timestamps=0
